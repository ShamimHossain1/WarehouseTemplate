      specs: [['Clear strip', '13 × 4.5 ft at the shutter'], ['Jack aisle', '3 ft, up the right side'], ['Unbox spot', 'beside the packing table']] },
    { name: 'Pallet storage', cam: [-1, 11, 17], tgt: [8, 1, 4], labels: ['pallets', 'aisle', 'pack'],
      text: 'Ten pallets sit in two columns of five against the right wall, forks facing the aisle. Empty the front column first. The jack parks the pallet you are opening beside the packing table, and you unbox, test and pack on that one big table.',
      specs: [['Pallet', '48 × 40 in · ten of them'], ['Block', '8 × 16.7 ft'], ['Unboxing', 'on the packing table']] },
    { name: 'Racks', cam: [16, 13, 12], tgt: [3, 2, -4], labels: ['racksN', 'racksW', 'island', 'small'],
      text: 'Twelve tall racks (black): 6 on the back wall, 3 on the left wall and 3 in a row as an island in the middle. Four short racks (blue), 4 ft tall and 3 ft wide, sit back to back in the back-right corner above the pallets. Every aisle stays about 3.5 ft or wider, enough for a person with a cart.',
      specs: [['Tall rack', '47 × 18 × 72 in · 5 shelves'], ['Tall racks', '12 · 60 shelves'], ['Short rack', '36 × 18 × 48 in · 3 shelves'], ['Short racks', '4 · 12 shelves'], ['Aisles', '3.5 ft or wider']],
      legend: true },
    { name: 'Desks and testing', cam: [-1, 9, 17], tgt: [-6, 1.5, 2], labels: ['desks', 'test', 'fridge'],
      text: 'The two 55 in desks sit side by side so the two of you face each other, each with a 34 in ultrawide monitor. The 48 in test table has the 13-port power strip, two laptop spots and an iPad spot. A second tester can stand on the open side later. The fridge and oven are on the left wall.',
      specs: [['Desks', '2 × 55 × 24 in, facing'], ['Chair room', 'about 2.5 ft behind each'], ['Test table', '48 in · 13 ports'], ['Fridge + oven', 'left wall, 3 steps away']] },
    { name: 'Packing and shipping', cam: [6, 9, 21], tgt: [-3, 1.5, 7], labels: ['pack', 'shutter', 'lane'],
      text: 'The 69 × 45 in packing table sits next to the shutter. Pallets are opened here too. Tested items come over from the test table, get boxed and labeled, and go straight out. Two people can pack at once, one on each long side.',
      specs: [['Table', '69 × 45 in'], ['Standing room', '2.8 ft north · 4.7 ft south'], ['To the shutter', 'about 5 ft']] },
    { name: 'Growth and extras', cam: [4, 34, 14], tgt: [0, 0, 1], labels: ['hireT', 'hireP', 'small', 'fridge'],
      text: 'The translucent figures show where two hires would stand: a tester at the test table and a packer at the packing table. Taller 8 ft racks add about a third more shelf space without using more floor.',
      specs: [['Hire 1', 'tester, south side of test table'], ['Hire 2', 'packer, north side of packing table']],
      extras: ['Label printer and scale on the packing table', 'Fire extinguisher at the door (red cylinder)', 'First-aid kit by the fridge', 'Two cameras: shutter and door', 'Bins for cardboard and trash by the packing table', 'Extra outlets above both desks', 'Rack labels N1 to N6, W1 to W3, I1 to I3, S1 to S4'] },
    { name: 'Comfort and calm', cam: [4, 11, 30], tgt: [-7, 2, 6], labels: ['rug', 'nook', 'sign', 'board', 'mats'],
      text: 'You will spend half of every day here, so the plan treats it like an office that also ships. Warm light and a rug over the desks, a reset corner with a chair and a lamp, a weekly board, a brand wall, plants, and soft mats where you stand all day.',
      specs: [['Light over desks', 'warm, 2700 to 3000K'], ['Light over test and pack', 'bright, 4000 to 5000K'], ['Rug', 'about 8.5 × 5 ft under the desks'], ['Mats', 'test table and packing table']],
      extras: ['Plants that handle low light: pothos, snake plant, ZZ plant', 'Low music on a speaker; the rug and a few acoustic panels cut echo', 'Weekly board on the left wall: to test, packing, shipped', 'Brand sign on the back wall so it feels like your company', '10-minute reset at day end: clear tables, scan, label', 'A fan or purifier, and a dehumidifier if the air gets damp'] }
  ];
  var cur = 0, playing = false, timer = null, topView = false;
  var tabsEl = document.getElementById('tabs'), detailEl = document.getElementById('detail');
  var tween = null;

  function flyTo(cam, tgt, dur) {
    if (reduce) { camera.position.set(cam[0], cam[1], cam[2]); controls.target.set(tgt[0], tgt[1], tgt[2]); return; }
    tween = { t0: performance.now(), dur: dur || 2200, fp: camera.position.clone(), ft: controls.target.clone(), tp: new T.Vector3(cam[0], cam[1], cam[2]), tt: new T.Vector3(tgt[0], tgt[1], tgt[2]) };
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function renderDetail(s) {
    var h = '<h2>' + esc(s.name) + '</h2><p>' + esc(s.text) + '</p><dl class="specs">';
    s.specs.forEach(function (r) { h += '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; });
    h += '</dl>';
    if (s.legend) h += '<div class="legend"><span><i style="background:#1b1e23"></i>Tall · 12</span><span><i style="background:#2563a8"></i>Short · 4</span></div>';
    if (s.extras) { h += '<ul class="extras">'; s.extras.forEach(function (e) { h += '<li>' + esc(e) + '</li>'; }); h += '</ul>'; }
    detailEl.innerHTML = h; detailEl.scrollTop = 0;
  }
  function buildTabs() {
    STEPS.forEach(function (s, n) {
      var b = document.createElement('button'); b.className = 'tab'; b.type = 'button';
      b.innerHTML = '<span>' + (n === 0 ? '·' : n) + '</span>' + esc(s.name);
      b.addEventListener('click', function () { setPlaying(false); goStep(n); });
      tabsEl.appendChild(b);
    });
  }
  function goStep(n, fromTimer) {
    cur = n; topView = false; document.getElementById('btnTop').setAttribute('aria-pressed', 'false');
    var s = STEPS[n];
    Array.prototype.forEach.call(tabsEl.children, function (c, k) { if (k === n) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current'); });
    renderDetail(s);
    LABELS.forEach(function (l) { l.show = s.labels.indexOf(l.id) >= 0; });
    flyTo(s.cam, s.tgt);
    if (n === 3 || n === 6) { if (!growOn) setGrow(true); }
    schedule();
  }
  function schedule() { clearTimeout(timer); if (playing) timer = setTimeout(function () { goStep((cur + 1) % STEPS.length, true); }, 8000); }
  function setPlaying(v) { playing = v; document.getElementById('btnPlay').setAttribute('aria-pressed', String(v)); document.getElementById('btnPlay').textContent = v ? 'Pause tour' : 'Play tour'; schedule(); }
  var growOn = true;
  function setGrow(v) { growOn = v; phase2.forEach(function (g) { g.visible = v; }); document.getElementById('btnGrow').setAttribute('aria-pressed', String(v)); }

  document.getElementById('btnPlay').addEventListener('click', function () { setPlaying(!playing); });
  document.getElementById('btnGrow').addEventListener('click', function () { setGrow(!growOn); });
  document.getElementById('btnLabels').addEventListener('click', function () { labelsOn = !labelsOn; this.setAttribute('aria-pressed', String(labelsOn)); });
  document.getElementById('btnTop').addEventListener('click', function () {
    topView = !topView; this.setAttribute('aria-pressed', String(topView));
    if (topView) { setPlaying(false); flyTo([0, 44, 0.01], [0, 0, 0]); LABELS.forEach(function (l) { l.show = ['pallets', 'racksN', 'racksW', 'island', 'small', 'desks', 'test', 'pack', 'fridge', 'lane', 'aisle'].indexOf(l.id) >= 0; }); }
    else goStep(cur);
  });
  controls.addEventListener('start', function () { tween = null; if (playing) setPlaying(false); });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    var narrow = w < 760; camera.fov = narrow ? 52 : 38; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  var clock0 = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (tween) {
      var k = Math.min((now - tween.t0) / tween.dur, 1);
      var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(tween.fp, tween.tp, e); controls.target.lerpVectors(tween.ft, tween.tt, e);
      if (k >= 1) tween = null;
    }
    var t = reduce ? 0 : (now - clock0) / 1000;

    var js = sample(jackTL, t);
    jack.position.copy(js.pos);
    if (js.dir.lengthSq() > 0.0001) jackAng = turn(jackAng, Math.atan2(js.dir.x, js.dir.z));
    jack.rotation.y = jackAng;
    carried.visible = js.carry;
    dropped.visible = !js.carry && js.t >= dropT && (js.t < jackTL.total);
    var jy = js.pos.z + HALF;
    var target = jy > 22.6 && js.pos.x < X(17) ? 1 : 0;
    if (reduce) target = 0;
    shutterOpen += (target - shutterOpen) * 0.06;
    shutter.scale.y = 1 - shutterOpen * 0.92; shutter.position.y = 8 - 4 * shutter.scale.y;

    var ws = sample(walkTL, t + 3);
    walker.g.position.copy(ws.pos);
    if (ws.move && ws.dir.lengthSq() > 0.0001) walkAng = turn(walkAng, Math.atan2(ws.dir.x, ws.dir.z));
    else if (!ws.move) walkAng = turn(walkAng, Math.atan2(0.4, 1));
    walker.g.rotation.y = walkAng;
    var sw = ws.move ? Math.sin(t * 6.5) * 0.55 : 0;
    walker.legs[0].rotation.x = sw; walker.legs[1].rotation.x = -sw;
    walker.arms[0].rotation.x = ws.carry ? -1.2 : -sw * 0.8; walker.arms[1].rotation.x = ws.carry ? -1.2 : sw * 0.8;
    walker.carry.visible = ws.carry;
    walker.body.position.y = ws.move ? Math.abs(Math.sin(t * 6.5)) * 0.06 : 0;

    pA.arms[0].rotation.x = -1.15 + Math.sin(t * 9) * 0.06; pA.arms[1].rotation.x = -1.15 + Math.cos(t * 8) * 0.06;
    pB.arms[0].rotation.x = -1.15 + Math.cos(t * 7) * 0.06; pB.arms[1].rotation.x = -1.15 + Math.sin(t * 10) * 0.06;
    for (var q = 0; q < ledMats.length; q++) ledMats[q].color.setHex(Math.sin(t * 2 + q * 1.3) > -0.4 ? 0x2bd96b : 0x145c33);

    controls.update();
    renderer.render(scene, camera);
    updateLabels();
  }

  resize(); buildTabs(); goStep(0);
  requestAnimationFrame(frame);
  if (!reduce) setTimeout(function () { if (!tween) setPlaying(true); }, 3500);
})();
</script>
